# The backend on Render. The frontend is on Vercel and is not described here.
#
# Nothing in the application knows it is on Render: `PUBLIC_HOSTNAME` is a
# platform-neutral hook filled below from the service's own host, so moving
# hosts means changing this file and nothing in the code.
#
# Values marked sync:false are set by hand in the dashboard - they are secrets,
# or they are URLs that do not exist until the other half is deployed.

services:
  - type: web
    name: goldride-backend
    runtime: python
    plan: starter # free cannot mount the disk below, and sleeps after 15 idle minutes
    buildCommand: bash build.sh
    # Daphne, not gunicorn: gunicorn is WSGI and cannot carry a websocket at
    # all. Under it the chat handshake fails and the browser retries forever.
    startCommand: cd backend && daphne -b 0.0.0.0 -p $PORT goldride_project.asgi:application
    healthCheckPath: /api/cars/

    # Uploaded car photographs. Without this, DEBUG=false serves /media/ as 404
    # - see DEPLOY.md - and Render's filesystem is wiped on every deploy anyway,
    # so an ephemeral disk would lose them even while they appeared to work.
    disk:
      name: media
      mountPath: /opt/render/project/src/backend/media
      sizeGB: 1

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # Render exports its own hostname under this name; the app reads it as a
      # generic one and merges it into ALLOWED_HOSTS.
      - key: PUBLIC_HOSTNAME
        fromService:
          type: web
          name: goldride-backend
          property: host

      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SECURE_HTTPS
        value: "true"

      - key: DATABASE_URL
        fromDatabase:
          name: goldride-db
          property: connectionString
      - key: REDIS_URL
        sync: false # without it the channel layer is per-process, so chat breaks across workers

      # Both halves of the origin handshake. CORS_ALLOWED_ORIGINS is the Vercel
      # URL, FRONTEND_URL is where emailed links point - they are the same
      # domain but different jobs, so they are set separately.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SITE_URL
        sync: false # this service's own https:// URL, for /pay/<reference>/ links

      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: MPESA_ENVIRONMENT
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false

      - key: EMAIL_BACKEND
        value: goldride_app.email_backends.ResendBackend
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false

databases:
  - name: goldride-db
    databaseName: goldride_motors
    user: goldride
    plan: basic-256mb
